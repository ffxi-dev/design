<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sruon.dev family layer</title>
<link rel="stylesheet" href="family.css">
<style>body { font: 12.5px/1.45 var(--font-mono); padding: 16px; } section { margin: 0 0 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }</style>
</head>
<body>
<section><span class="wordmark"><a class="wordmark-prefix" href="https://sruon.dev">sruon</a><svg class="wordmark-glyph" width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0.5 L11.5 6 L6 11.5 L0.5 6 Z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 3 L9 6 L6 9 L3 6 Z" fill="currentColor" opacity="0.4"/></svg><a class="wordmark-site" href="/">demo</a></span></section>
<section><button>Button</button><button class="primary">Primary</button><button class="ghost">Ghost</button><button disabled>Disabled</button><input placeholder="input"><input type="checkbox" checked></section>
<section><span class="label">Label</span><span class="chip">slate</span><span class="chip green">green</span><span class="chip amber">amber</span><span class="chip blue">blue</span><span class="chip red">red</span><kbd>Ctrl</kbd><kbd>K</kbd><a href="#">link</a><code>code</code></section>
<section><div class="state-frame"><div class="state-frame-icon"><span class="state-bracket tl"></span><span class="state-bracket tr"></span><span class="state-bracket bl"></span><span class="state-bracket br"></span>∅</div><div class="state-frame-title">No packets match these filters</div><div class="state-frame-body">Clear a filter or <code>import</code> a capture.</div><div class="state-frame-action"><button>Clear filters</button></div></div></section>
<section><span style="font-family: var(--font-sans)">Inter Tight 400</span><b style="font-family: var(--font-sans)">Inter Tight 700</b><span>JetBrains Mono 400</span><b>JetBrains Mono 700</b></section>
</body>
</html>
